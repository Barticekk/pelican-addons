docker_images:
  'Node.js 24': 'ghcr.io/pelican-eggs/yolks:nodejs_24'
file_denylist: {  }
startup_commands:
  Default: 'N8N_PORT={{SERVER_PORT}} N8N_LISTEN_ADDRESS=0.0.0.0 N8N_USER_FOLDER=/home/container WEBHOOK_URL={{PUBLIC_URL}} N8N_EDITOR_BASE_URL={{PUBLIC_URL}} GENERIC_TIMEZONE=${TZ:-UTC} N8N_SECURE_COOKIE={{SECURE_COOKIE}} N8N_DIAGNOSTICS_ENABLED={{DIAGNOSTICS}} N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true ./node_modules/.bin/n8n start'
config:
  files: {  }
  startup:
    done: 'Editor is now accessible via'
  logs: {  }
  stop: ^C
scripts:
  installation:
    script: |-
      #!/bin/bash
      # n8n install script
      #
      # Server Files: /mnt/server
      set -e
      trap 'echo "Install failed at line ${LINENO}: ${BASH_COMMAND}"' ERR

      cd /mnt/server

      if [ ! -f package.json ]; then
          cat > package.json <<'EOF'
      {
        "name": "n8n-server",
        "private": true
      }
      EOF
      fi

      VERSION=${N8N_VERSION:-latest}
      echo "Installing n8n@${VERSION}, this takes a few minutes"
      npm install --omit=dev --no-audit --no-fund --loglevel=error "n8n@${VERSION}"

      ./node_modules/.bin/n8n --version

      echo "-----------------------------------------"
      echo "n8n installed"
      echo "-----------------------------------------"
    container: 'node:24-trixie-slim'
    entrypoint: bash
variables:
  -
    sort: 1
    name: 'Public URL'
    description: 'URL users and webhooks reach n8n on, with a trailing slash, e.g. https://n8n.example.com/'
    env_variable: PUBLIC_URL
    default_value: 'http://127.0.0.1:5678/'
    user_viewable: true
    user_editable: true
    rules:
      - required
      - url
      - 'regex:/^https?:\/\/[^\s"''`$;&|<>]+\/$/'
  -
    sort: 2
    name: 'Secure Cookie'
    description: 'true behind HTTPS (recommended). Set false only to test over plain HTTP.'
    env_variable: SECURE_COOKIE
    default_value: 'true'
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - 'in:true,false'
  -
    sort: 3
    name: 'Send Diagnostics'
    description: 'Anonymous usage data to n8n.'
    env_variable: DIAGNOSTICS
    default_value: 'false'
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - 'in:true,false'
  -
    sort: 4
    name: 'n8n Version'
    description: 'latest or a version such as 2.45.7. Reinstall to update; workflows in .n8n/ are kept.'
    env_variable: N8N_VERSION
    default_value: latest
    user_viewable: true
    user_editable: true
    rules:
      - required
      - 'regex:/^(latest|next|[0-9]+\.[0-9]+\.[0-9]+)$/'
