    description: 'Start without BattlEye. Not recommended for public servers.'
    env_variable: NO_BATTLEYE
    default_value: 0
    user_viewable: true
    user_editable: true
    rules:
      - required
      - boolean
  -
    sort: 8
    name: 'Auto Update'
    description: 'Check for server updates with SteamCMD on every start.'
    env_variable: AUTO_UPDATE
    default_value: 1
    user_viewable: true
    user_editable: true
    rules:
      - required
      - boolean
  -
    sort: 9
    name: 'App ID'
    description: ''
    env_variable: SRCDS_APPID
    default_value: 3792580
    user_viewable: false
    user_editable: false
    rules:
      - required
      - 'in:3792580'
  -
    sort: 10
    name: 'Windows Install'
    description: ''
    env_variable: WINDOWS_INSTALL
    default_value: 1
    user_viewable: false
    user_editable: false
    rules:
      - required
      - 'in:1'
  -
    sort: 11
    name: 'Wine Debug'
    description: ''
    env_variable: WINEDEBUG
    default_value: '-all'
    user_viewable: false
    user_editable: false
    rules:
      - required
      - string
  -
    sort: 12
    name: 'Winetricks'
    description: 'Space separated winetricks verbs installed on start, e.g. vcrun2022.'
    env_variable: WINETRICKS_RUN
