    sort: 1
    name: 'Steam Username'
    description: 'Steam account that owns Assetto Corsa Competizione. A separate account is recommended.'
    env_variable: STEAM_USER
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - 'max:64'
  -
    sort: 2
    name: 'Steam Password'
    description: ''
    env_variable: STEAM_PASS
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - 'max:128'
  -
    sort: 3
    name: 'Steam Guard Code'
    description: 'E-mail Steam Guard code for the first install. Leave empty when approving in the Steam mobile app.'
    env_variable: STEAM_AUTH
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - 'regex:/^[A-Za-z0-9]{5}$/'
  -
    sort: 4
    name: 'Server Name'
    description: 'Initial value written to acc-config/settings.json on the first install.'
    env_variable: SERVER_NAME
    default_value: 'Pelican ACC Server'
    user_viewable: true
    user_editable: true
    rules:
      - required
      - 'regex:/^[^"\\]+$/'
      - 'max:64'
  -
    sort: 5
    name: 'Admin Password'
    description: 'Initial admin password (type /admin <password> in the in-game chat). First install only.'
    env_variable: ADMIN_PASSWORD
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - required
      - 'regex:/^[A-Za-z0-9_\-!.@]+$/'
      - 'max:32'
  -
    sort: 6
    name: 'Join Password'
    description: 'Initial join password, empty for public. First install only.'
    env_variable: SERVER_PASSWORD
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - 'regex:/^[A-Za-z0-9_\-!.@]+$/'
      - 'max:32'
  -
    sort: 7
