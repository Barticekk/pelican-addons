    description: 'Check for server updates on start (uses the stored Steam login).'
    env_variable: AUTO_UPDATE
    default_value: 1
    user_viewable: true
    user_editable: true
    rules:
      - required
      - boolean
  -
    sort: 11
    name: 'App ID'
    description: ''
    env_variable: SRCDS_APPID
    default_value: 1430110
    user_viewable: false
    user_editable: false
    rules:
      - required
      - 'in:1430110'
  -
    sort: 12
    name: 'Windows Install'
    description: ''
    env_variable: WINDOWS_INSTALL
    default_value: 1
    user_viewable: false
    user_editable: false
    rules:
      - required
      - 'in:1'
