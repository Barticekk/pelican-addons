name: 'Call of Duty 4 (CoD4x)'
author: barticekk@barticekk.eu
uuid: 6509f50a-ee4e-443b-84ff-b6aec31a9af4
description: |-
  CoD4x is the maintained server for Call of Duty 4: Modern Warfare. It fixes the original server's
  bugs and adds plugins, a new master server and automatic client updates. The original game files
  (main/*.iwd and zone/) have to be uploaded from your own copy of the game.
icon: null
tags:
  - cod
features: {  }
docker_images:
  'Debian (32-bit libs)': 'ghcr.io/pelican-eggs/steamcmd:debian'
file_denylist: {  }
startup_commands:
  Default: './cod4x18_dedrun +set dedicated 2 +set net_port {{SERVER_PORT}} +set fs_basepath /home/container +set fs_homepath /home/container +set sv_maxclients {{MAX_PLAYERS}} +set sv_authtoken "{{AUTH_TOKEN}}" $( [ -n "{{FS_GAME}}" ] && printf %s "+set fs_game {{FS_GAME}}" ) +exec {{SERVER_CONFIG}} +map_rotate'
config:
  files: {  }
  startup:
    done: 'By using this software you agree to the usage conditions'
  logs: {  }
  stop: quit
scripts:
  installation:
    script: |-
      #!/bin/bash
      # CoD4x install script
      #
      # Server Files: /mnt/server
      set -e
      trap 'echo "Install failed at line ${LINENO}: ${BASH_COMMAND}"' ERR

      apt-get update
      apt-get install -y --no-install-recommends curl ca-certificates unzip

      cd /mnt/server
      mkdir -p main zone mods usermaps plugins

      if [ -z "${COD4X_VERSION}" ] || [ "${COD4X_VERSION}" == "latest" ]; then
          BASE=https://github.com/callofduty4x/CoD4x_Server/releases/latest/download
      else
          BASE=https://github.com/callofduty4x/CoD4x_Server/releases/download/${COD4X_VERSION}
      fi

      echo "Downloading CoD4x server from ${BASE}"
      curl -fsSL -o cod4x18_dedrun "${BASE}/cod4x18_dedrun"
      chmod 755 cod4x18_dedrun

      if curl -fsSL -o /tmp/plugins.zip "${BASE}/plugins_linux.zip"; then
          unzip -oqj /tmp/plugins.zip -d plugins
          rm -f /tmp/plugins.zip
      fi

      if [ ! -f "main/${SERVER_CONFIG}" ]; then
          cat > "main/${SERVER_CONFIG}" <<'EOF'
      // CoD4x server config, executed on start
      set sv_hostname "^2Pelican ^7CoD4x Server"
      set g_motd "Have fun"
      set rcon_password ""
      set g_password ""
      set sv_privateClients 0
      set sv_privatePassword ""

      set sv_pure 1
      set sv_floodprotect 1
      set sv_maxPing 0
      set sv_minPing 0
      set sv_timeout 40
      set sv_allowDownload 1
      set sv_wwwDownload 0
      set sv_wwwBaseURL ""

      set g_gametype "war"
      set scr_war_scorelimit 7500
      set scr_war_timelimit 15
      set scr_teambalance 1
      set scr_game_spectatetype 1

      set sv_mapRotation "gametype war map mp_crash gametype war map mp_backlot gametype war map mp_strike gametype war map mp_crossfire gametype war map mp_vacant gametype war map mp_overgrown gametype war map mp_citystreets gametype war map mp_bloc"
      EOF
          if [ -n "${RCON_PASSWORD}" ]; then
              sed -i "s#^set rcon_password \"\"#set rcon_password \"${RCON_PASSWORD}\"#" "main/${SERVER_CONFIG}"
          fi
      fi

      if ! ls main/iw_*.iwd > /dev/null 2>&1; then
          echo "================================================================"
          echo " Upload the original game files before starting the server:"
          echo "   <CoD4 folder>/main/*.iwd  ->  main/"
          echo "   <CoD4 folder>/zone/*      ->  zone/"
          echo "================================================================"
      fi

      echo "-----------------------------------------"
      echo "CoD4x installed"
      echo "-----------------------------------------"
    container: 'ghcr.io/pelican-eggs/installers:debian'
    entrypoint: bash
variables:
  -
    sort: 1
    name: 'Max Players'
    description: ''
    env_variable: MAX_PLAYERS
    default_value: 24
    user_viewable: true
    user_editable: true
    rules:
      - required
      - integer
      - 'between:1,64'
  -
    sort: 2
    name: 'Server Config'
    description: 'Config file in main/ executed on start.'
    env_variable: SERVER_CONFIG
    default_value: server.cfg
    user_viewable: true
    user_editable: true
    rules:
      - required
      - 'regex:/^[A-Za-z0-9_\-]+\.cfg$/'
  -
    sort: 3
    name: 'RCON Password'
    description: 'Written into the config on the first install; change it there afterwards.'
    env_variable: RCON_PASSWORD
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - 'regex:/^[A-Za-z0-9_\-!.@]+$/'
      - 'max:32'
  -
    sort: 4
    name: 'Auth Token'
    description: 'Server token from the CoD4x master server (cod4x.ovh), needed to be listed publicly.'
    env_variable: AUTH_TOKEN
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - 'regex:/^[A-Za-z0-9]+$/'
      - 'max:128'
  -
    sort: 5
    name: 'Mod (fs_game)'
    description: 'Optional mod folder, e.g. mods/promod. Leave empty for the stock game.'
    env_variable: FS_GAME
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - nullable
      - 'regex:/^mods\/[A-Za-z0-9_\-]+$/'
  -
    sort: 6
    name: 'CoD4x Version'
    description: 'latest or a release tag such as 21.2. Reinstall to update.'
    env_variable: COD4X_VERSION
    default_value: latest
    user_viewable: true
    user_editable: true
    rules:
      - required
      - 'regex:/^(latest|[0-9]+(\.[0-9]+)*)$/'
